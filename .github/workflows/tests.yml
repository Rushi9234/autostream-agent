name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        # `python -m pytest` (not a bare `pytest`) prepends the repo root to
        # sys.path -- without it, pytest can't find agent.py/rag.py/tools.py
        # (they live at the repo root, not under tests/) since there's no
        # tests/__init__.py. Matches how this is run locally.
        run: python -m pytest tests/ -v
